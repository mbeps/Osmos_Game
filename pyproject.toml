[project]
name = "Osmos"
version = "0.1.0"
description = "Osmos game"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maruf Bepary", email = "bepary71@gmail.com" }]
keywords = ["game", "osmos"]
dependencies = [
    "SimpleGUICS2Pygame>=2.1.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/mbeps/Osmos_Game"
Repository = "https://github.com/mbeps/Osmos_Game"

[tool.hatch.build.targets.wheel]
packages = [
    "Entities",
    "Game_Control",
    "Maps",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0,<2.0.0",
    "flake8>=5.0.4,<6.0.0",
    "pytest>=7.1.2,<8.0.0",
    "ruff>=0.14.9,<0.15.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API.*:DeprecationWarning:pygame.pkgdata",
]

[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"
